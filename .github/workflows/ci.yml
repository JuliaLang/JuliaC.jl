name: CI

on:
  push:
    branches: [ main ]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: [ '1' , 'pre', 'nightly']
        os: [ ubuntu-latest, windows-latest, macos-15-intel]
        arch: [ x64 ]
        include:
          - os: macos-latest
            arch: aarch64
            version: '1'
          - os: macos-latest
            arch: aarch64
            version: 'pre'
          - os: macos-latest
            arch: aarch64
            version: 'nightly'
          - os: ubuntu-latest
            arch: x86
            version: '1'
          - os: ubuntu-latest
            arch: x86
            version: 'pre'
          - os: ubuntu-latest
            arch: x86
            version: 'nightly'
          - os: windows-latest
            arch: x86
            version: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Install 32-bit cross toolchain
        if: ${{ runner.os == 'Linux' && matrix.arch == 'x86' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  test-freebsd:
    name: Julia ${{ matrix.version }} - FreeBSD - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ '1' ]
        arch: [ x86_64 ]
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          copyback: false
          arch: ${{ matrix.arch }}
          prepare: |
            pkg update -q
            pkg install -q -y curl
            mkdir -p /tmp/juliaup
            curl -fsSL https://install.julialang.org | sh -s -- \
                --path=/tmp/juliaup \
                --default-channel=${{ matrix.version }} \
                --yes \
                --add-to-path=no \
                --background-selfupdate=0 \
                --startup-selfupdate=0
            ln -s /tmp/juliaup/bin/julia /usr/local/bin/julia
          run: |
            julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
